<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>ARPHE — Story/Reel 1080x1920</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    @page { size: 1080px 1920px; margin: 0; }
    html, body, .canvas { width: 1080px; height: 1920px; }
    .canvas { padding: 104px 72px 76px; }
    .brand-logo { width: 220px; margin-left: auto; }
    .photo-placeholder { width: 936px; height: 780px; margin-top: 72px; }
    .copy { position: absolute; left: 72px; right: 72px; bottom: 96px; }
    .title { max-width: 880px; font-size: 126px; }
    .body-copy { max-width: 730px; margin: 36px 0 48px; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="brand-logo" src="../../logos/svg/arphe-logo-ink.svg" alt="Arphé">
    <div class="photo-placeholder">Inserisci foto o video in bianco e nero</div>
    <section class="copy">
      <div class="eyebrow">Medicina e benessere</div>
      <h1 class="title">Una cura <em>su misura</em></h1>
      <p class="body-copy">Testo informativo essenziale. Nessuna promessa o formulazione promozionale.</p>
      <div class="button">Approfondisci</div>
    </section>
  </main>
</body>
</html>
