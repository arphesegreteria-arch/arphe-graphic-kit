<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>ARPHE — Story/Reel 1080x1920</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    @page { size: 1080px 1920px; margin: 0; }
    html, body, .canvas { width: 1080px; height: 1920px; }
    .canvas { padding: 192px 173px 346px 86px; }
    .brand-logo { width: 220px; }
    .photo-placeholder { width: 821px; height: 650px; margin-top: 48px; }
    .copy { position: absolute; left: 86px; right: 173px; bottom: 346px; }
    .title { max-width: 821px; font-size: 112px; }
    .body-copy { max-width: 730px; margin: 36px 0 48px; }
  </style>
</head>
<body>
  <main class="canvas" data-font-status="checking">
    <div id="font-fallback-badge" class="font-fallback-badge" role="status">DRAFT — FONT FALLBACK</div>
    <img class="brand-logo" data-essential="true" src="../../logos/svg/arphe-logo-ink.svg" alt="Arphé">
    <div class="photo-placeholder" data-essential="true">Inserisci foto o video in bianco e nero</div>
    <section class="copy" data-essential="true">
      <div class="eyebrow">Medicina e benessere</div>
      <h1 class="title">Una cura <em>su misura</em></h1>
      <p class="body-copy">Testo informativo essenziale. Nessuna promessa o formulazione promozionale.</p>
      <div class="button">Approfondisci</div>
    </section>
  </main>
  <script>
    (async () => {
      const canvas = document.querySelector('.canvas');
      const badge = document.getElementById('font-fallback-badge');
      let ready = false;
      try {
        await document.fonts.ready;
        ready = [
          document.fonts.check("400 1em Satoshi"),
          document.fonts.check("500 1em Satoshi"),
          document.fonts.check("700 1em Satoshi"),
          document.fonts.check("300 1em Noto Serif Display ARPHE")
        ].every(Boolean);
      } catch (error) {
        ready = false;
      }
      canvas.dataset.fontStatus = ready ? 'ready' : 'fallback';
      badge.setAttribute('aria-live', 'polite');
    })();
  </script>
</body>
</html>
