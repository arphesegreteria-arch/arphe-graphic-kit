<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>ARPHE — Post 1080x1350</title>
  <link rel="stylesheet" href="../shared/brand.css">
  <style>
    @page { size: 1080px 1350px; margin: 0; }

    .canvas { padding: 76px 64px 58px; }

    .brand-logo { width: 190px; }

</head>
<body>
  <main class="canvas">
    <div class="eyebrow">Poliambulatorio a Brescia</div>
    <h1 class="title">Titolo <em>editoriale</em></h1>
    <p class="body-copy">Inserisci qui una descrizione informativa breve, chiara e rassicurante.</p>
    <div class="photo-placeholder">Inserisci foto in bianco e nero</div>
    <footer class="footer">
      <div class="button">Scopri il servizio</div>
      <img class="brand-logo" src="../../logos/svg/arphe-logo-ink.svg" alt="Arphé">
    </footer>

</html>
